<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班聚麥當勞點餐系統 (沙鹿中棲店-外送版)</title>
    <style>
        :root { --mcd-red: #DA291C; --mcd-yellow: #FFC72C; --bg-color: #f8f9fa; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 850px) { .layout-grid { grid-template-columns: 1.6fr 1fr; } }
        .category-title { background: var(--mcd-yellow); color: #000; padding: 10px; border-radius: 6px; margin: 20px 0 10px; font-weight: bold; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="datetime-local"], select, input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-item:hover { border-color: var(--mcd-yellow); background: #fffdf5; }
        .menu-item.selected { border-color: var(--mcd-red); background: #fff5f5; }
        .price { color: var(--mcd-red); font-weight: bold; }
        .customizer { background: #fff9e6; border: 1px solid #ffd24d; border-radius: 8px; padding: 15px; margin: 15px 0; }
        .cart-panel { background: #fdfdfd; border: 2px solid #eee; border-radius: 10px; padding: 15px; position: sticky; top: 10px; }
        .cart-item { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
        .btn { background: var(--mcd-red); color: #fff; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-add { background: #28a745; margin-top: 5px; }
        .btn-blue { background: #007bff; margin-top: 5px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .paid-row { background-color: #d4edda !important; }
        .hidden { display: none !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <div id="tab-order" class="btn" style="background:#e9ecef; color:#000; width:48%" onclick="switchTab('order')">同學點餐</div>
            <div id="tab-admin" class="btn" style="background:#e9ecef; color:#000; width:48%" onclick="switchTab('admin')">主辦人後台</div>
        </div>

        <div id="order-view">
            <h2 style="text-align:center; color:var(--mcd-red)">🍟 班聚外送點餐系統</h2>
            <div style="text-align:center; font-weight:bold; color:var(--mcd-red); margin-bottom:10px;" id="timer"></div>
            <div class="form-group">
                <label>你的名字 (必填)：</label>
                <input type="text" id="student-name" placeholder="請輸入真實姓名">
            </div>

            <div class="layout-grid">
                <div id="menu-area">
                    <div class="form-group">
                        <label>選擇餐點類別：</label>
                        <select id="cat-select" onchange="switchCat(this.value)">
                            <option value="burger">漢堡 (可加全餐)</option>
                            <option value="chicken">雞塊與麥脆鷄 (可加全餐)</option>
                            <option value="drink">各式飲品 (單點)</option>
                            <option value="snack">甜點與點心 (單點)</option>
                        </select>
                    </div>
                    <div id="main-list-container">
                        <div class="menu-grid" id="item-grid"></div>
                    </div>
                    <div id="custom-box" class="customizer hidden">
                        <h4 style="margin:0 0 10px; color:var(--mcd-red)">🛠️ 選擇細節</h4>
                        <div id="side-select-area" class="form-group">
                            <label>選擇配餐 (歡樂送加價)：</label>
                            <select id="side-select" onchange="updateSubtotal()">
                                <option value="none">單點 (不加配餐)</option>
                                <option value="A">A 經典配餐: 中薯+38飲品 (+$65)</option>
                                <option value="B">B 清爽配餐: 四季沙拉+38飲品 (+$70)</option>
                                <option value="C">C 勁脆配餐: 1塊麥脆鷄+38飲品 (+$84)</option>
                                <option value="D">D 豪爽配餐: 大薯+1塊麥脆鷄+38飲品 (+$150)</option>
                                <option value="E">E 勁盤配餐: 大薯+6塊雞塊+38飲品 (+$150)</option>
                                <option value="F">F 歡樂配餐: 大薯+4塊雞塊+38飲品 (+$120)</option>
                            </select>
                        </div>
                        <div id="detail-options">
                            <div class="form-group opt-fry hidden"><label><input type="checkbox" id="fry-up" onchange="updateSubtotal()"> 薯條加大 (+$16)</label></div>
                            <div class="form-group opt-crispy hidden">
                                <label>配餐麥脆鷄口味：</label>
                                <select id="crispy-flavor" onchange="updateSubtotal()"><option value="原味">原味</option><option value="辣味">辣味</option></select>
                            </div>
                            <div class="form-group opt-flurry hidden">
                                <label>冰炫風口味：</label>
                                <select id="flurry-flavor" onchange="updateSubtotal()"><option value="OREO">OREO</option><option value="雙倍OREO">雙倍OREO (+$6)</option></select>
                            </div>
                            <div class="form-group" id="drink-select-group">
                                <label>選擇飲品 (基礎$38元，超額補差價)：</label>
                                <select id="drink-select" onchange="updateSubtotal()"></select>
                            </div>
                            <div class="form-group opt-sauce hidden">
                                <label>雞塊醬汁 (選一包)：</label>
                                <select id="sauce-select">
                                    <option value="糖醋醬包">糖醋醬包</option>
                                    <option value="蜂蜜芥末醬包">蜂蜜芥末醬包</option>
                                    <option value="泰式香辣醬包">泰式香辣醬包</option>
                                </select>
                            </div>
                        </div>
                        <div style="text-align:right; font-weight:bold;">小計: <span id="subtotal-price" class="price">$0</span></div>
                        <button class="btn btn-add" onclick="addToCart()">＋ 加入點餐清單</button>
                    </div>
                </div>

                <div class="cart-panel">
                    <h3 style="margin:0 0 10px; text-align:center">🛒 你的點餐清單</h3>
                    <div id="cart-items" style="max-height:300px; overflow-y:auto; border-bottom:1px solid #eee; margin-bottom:10px"></div>
                    <div style="font-size:14px; line-height:1.8">
                        <div>原價總計：<span id="cart-ori" style="float:right">$0</span></div>
                        <div style="color:green">學校補助：<span id="cart-sub" style="float:right">-$0</span></div>
                        <hr>
                        <div style="font-size:18px; font-weight:bold; color:var(--mcd-red)">應付金額：<span id="cart-fin" style="float:right">$0</span></div>
                    </div>
                    <button class="btn" style="margin-top:15px" onclick="submitOrder()">確認送出點餐</button>
                </div>
            </div>
        </div>

        <div id="admin-view" class="hidden">
            <h3 style="text-align:center">🛠️ 主辦人管理後台</h3>
            <div class="customizer" style="display: flex; gap: 10px; flex-wrap: wrap; padding: 10px;">
                <div style="flex: 1; min-width: 200px;">
                    <label>設定截止時間：</label>
                    <input type="datetime-local" id="set-deadline" onchange="saveDeadline()">
                </div>
                <div style="flex: 1; min-width: 200px; display: flex; align-items: flex-end; gap: 5px;">
                    <button class="btn btn-blue" onclick="syncFromCloud()">🔄 同步雲端資料</button>
                    <button class="btn" style="background:#6c757d;" onclick="clearData()">清空紀錄</button>
                    <button class="btn" style="background:#28a745;" onclick="copyUnpaidList()">複製收錢清單</button>
                </div>
            </div>
            <div id="admin-summary" style="background:#e9f2ff; padding:15px; border-radius:8px; margin: 15px 0; display:flex; gap:20px; flex-wrap:wrap; border: 1px solid #b3d7ff;"></div>
            <div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>姓名</th><th>細節</th><th>總價</th><th>應收</th><th>收/找</th><th>狀態</th><th>操作</th></tr></thead><tbody id="admin-tbody"></tbody></table></div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyfBKAoWu2ID_QPcBPrnd61h418Ozx4_g3ExSe1QBd6n2ip7sa0XtdTlSOqIEYRWV7ZPw/exec";

        const MENU = {
            burger: [
                { n: "辣味雙層四盎司牛肉堡", p: 135 }, { n: "辣味四盎司牛肉堡", p: 95 },
                { n: "雙層四盎司牛肉堡", p: 135 }, { n: "四盎司牛肉堡", p: 95 },
                { n: "大麥克", p: 81 }, { n: "BLT安格斯牛肉堡", p: 125 },
                { n: "蕈菇安格斯牛肉堡", p: 135 }, { n: "帕瑪森安格斯牛肉堡", p: 130 },
                { n: "雙層牛肉吉事堡", p: 75 }, { n: "勁辣鷄腿堡", p: 81 },
                { n: "嫩煎鷄腿堡", p: 86 }, { n: "帕瑪森主廚鷄腿堡", p: 130 },
                { n: "蕈菇主廚鷄腿堡", p: 135 }, { n: "BLT嫩煎鷄腿堡", p: 125 },
                { n: "麥香魚", p: 60 }, { n: "雙層麥香鷄", p: 81 }, { n: "麥香鷄", p: 51 }
            ],
            chicken: [
                { n: "麥克雞塊 (10塊)", p: 110, isNuggets: true },
                { n: "麥克雞塊 (6塊)", p: 69, isNuggets: true },
                { n: "原味麥脆鷄腿 (2塊)", p: 129 },
                { n: "辣味麥脆鷄腿 (2塊)", p: 129 }
            ],
            drink: [
                { n: "🥤 可口可樂(中)", p: 38 }, { n: "🍋 檸檬風味紅茶(冰)(中)", p: 38 },
                { n: "🥤 雪碧(中)", p: 38 }, { n: "🍵 無糖綠茶(冰)(中)", p: 44 }, { n: "🍂 無糖紅茶(冰)(中)", p: 44 },
                { n: "🥤 可口可樂 Zero(中)", p: 38 }, { n: "☕ 金選美式咖啡(熱)", p: 75 }, { n: "☕ 金選美式咖啡(冰)", p: 75 }, { n: "☕ 經典美式咖啡(熱)", p: 65 },
                { n: "☕ 經典美式咖啡(冰)", p: 65 }, { n: "🥛 金選那堤(熱)", p: 88 }, { n: "🥛 金選那堤(冰)", p: 88 },
                { n: "🍯 蜂蜜紅茶(冰)", p: 59 },
                { n: "🥛 蜂蜜奶茶(冰)", p: 69 }, { n: "🥛 蜂蜜奶茶(熱)", p: 69 }, { n: "🍬 焦糖奶茶(冰)", p: 69 }, { n: "🥣 玉米湯(小)", p: 46 },
                { n: "🥣 玉米湯(大)", p: 56 }, { n: "🥛 經典那堤(冰)", p: 78 },
                { n: "🥛 經典那堤(熱)", p: 78 }, { n: "🧋 奶茶(冰)", p: 51 }, { n: "🧋 奶茶(熱)", p: 51 },
                { n: "🍂 紅茶(熱)", p: 38 }, { n: "🍊 台灣鮮榨柳丁汁", p: 69 }, { n: "🥛 鮮乳", p: 33 },
                { n: "💧 Evian 礦泉水", p: 51 }
            ],
            snack: [
                { n: "草莓白巧克力三角派", p: 50 }, { n: "草莓雙派組", p: 95 }, { n: "雙倍OREO 冰炫風", p: 66 }, { n: "OREO 冰炫風", p: 120 }, { n: "OREO 冰炫風", p: 60 },
                { n: "蛋捲冰淇淋", p: 18 }, { n: "大蛋捲冰淇淋", p: 32 }, { n: "蘋果派", p: 41 },
                { n: "巧克力榛果可頌", p: 50 }, { n: "原味可頌", p: 50 }, { n: "肉桂捲", p: 50 }, { n: "玉米湯 (小)", p: 46 },
                { n: "玉米湯 (大)", p: 56 },
                { n: "麥克雞塊 (4塊)", p: 49, isNuggets: true },
                { n: "勁辣香雞翅 (6塊)", p: 131 }, { n: "勁辣香雞翅 (2塊)", p: 50 },
                { n: "原味麥脆雞腿 (1塊)", p: 69 }, { n: "辣味麥脆雞腿 (1塊)", p: 69 },
                { n: "漢堡 (單點)", p: 36 },
                { n: "薯條 (小)", p: 40 }, { n: "薯條 (中)", p: 50 }, { n: "薯條 (大)", p: 66 },
                { n: "水果袋 (芭樂)", p: 43 }, { n: "四季沙拉", p: 56 }
            ]
        };

        let currentCat = 'burger'; let selectedItem = null; let cart = [];
        let orders = JSON.parse(localStorage.getItem('mcd_orders_v4')) || [];
        let deadline = localStorage.getItem('mcd_deadline_v4') || "";

        window.onload = () => { switchCat('burger'); initDrinks(); renderAdmin(); updateClock(); setInterval(updateClock, 1000); };

        function switchCat(cat) {
            currentCat = cat; selectedItem = null;
            document.getElementById('custom-box').classList.add('hidden');
            const grid = document.getElementById('item-grid'); grid.innerHTML = "";
            if (MENU[cat]) {
                MENU[cat].forEach(item => {
                    const div = document.createElement('div');
                    div.className = "menu-item"; div.innerHTML = `<span>${item.n}</span><span class="price">$${item.p}</span>`;
                    div.onclick = () => selectItem(item, div); grid.appendChild(div);
                });
            }
        }

        function selectItem(item, el) {
            document.querySelectorAll('.menu-item').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected'); selectedItem = item;
            const box = document.getElementById('custom-box');
            if (['burger', 'chicken'].includes(currentCat) || item.isNuggets) {
                box.classList.remove('hidden');
                updateSubtotal();
            } else {
                box.classList.add('hidden');
                addToCart();
            }
        }

        function updateSubtotal() {
            if (!selectedItem) return;
            const sideArea = document.getElementById('side-select-area');
            const side = document.getElementById('side-select').value;
            let total = selectedItem.p;

            if (currentCat === 'snack') { sideArea.classList.add('hidden'); } 
            else {
                sideArea.classList.remove('hidden');
                // 更新後的外送配餐價格
                const sidePrices = { none: 0, A: 65, B: 70, C: 84, D: 150, E: 150, F: 120 };
                total += sidePrices[side];
            }

            const hasFry = (currentCat !== 'snack' && side === 'A');
            document.querySelector('.opt-fry').classList.toggle('hidden', !hasFry);
            if (hasFry && document.getElementById('fry-up').checked) total += 16;
            
            // 如果選 C 或 D，都要選麥脆鷄口味
            document.querySelector('.opt-crispy').classList.toggle('hidden', currentCat === 'snack' || !['C', 'D'].includes(side));
            
            document.querySelector('.opt-flurry').classList.toggle('hidden', currentCat === 'snack' || side !== 'D_OLD'); // 舊的D保留位

            // 醬料邏輯：主餐是雞塊，或是選了 E 或 F 配餐
            const needsSauce = selectedItem.isNuggets || ['E', 'F'].includes(side);
            document.querySelector('.opt-sauce').classList.toggle('hidden', !needsSauce);

            const drinkGroup = document.getElementById('drink-select-group');
            if (currentCat === 'snack' || side === 'none') { drinkGroup.classList.add('hidden'); } 
            else {
                drinkGroup.classList.remove('hidden');
                const drinkIdx = document.getElementById('drink-select').selectedIndex;
                total += MENU.drink[drinkIdx].p - 38;
            }
            document.getElementById('subtotal-price').innerText = `$${total}`;
        }

        function addToCart() {
            if (!selectedItem) return;
            let info = selectedItem.n; let p;
            const side = document.getElementById('side-select').value;
            
            if (['burger', 'chicken'].includes(currentCat)) {
                p = parseInt(document.getElementById('subtotal-price').innerText.replace('$', '')) || selectedItem.p;
                if (side !== 'none') {
                    info += ` + ${side}配餐`;
                    if (side === 'A' && document.getElementById('fry-up').checked) info += "(薯大+$16)";
                    if (['C', 'D'].includes(side)) info += `(${document.getElementById('crispy-flavor').value})`;
                    info += ` (${MENU.drink[document.getElementById('drink-select').selectedIndex].n})`;
                }
            } else { p = selectedItem.p; }

            // 帶入醬料資訊
            if (selectedItem.isNuggets || ['E', 'F'].includes(side)) {
                info += `(${document.getElementById('sauce-select').value})`;
            }

            cart.push({ info, p }); updateCart();
            selectedItem = null; document.querySelectorAll('.menu-item').forEach(d => d.classList.remove('selected'));
            document.getElementById('custom-box').classList.add('hidden');
            document.getElementById('fry-up').checked = false; document.getElementById('side-select').value = "none";
        }

        function updateCart() {
            const div = document.getElementById('cart-items');
            div.innerHTML = cart.map((it, i) => `<div class="cart-item"><b>${it.info}</b> <span class="price" style="float:right">$${it.p}</span><button onclick="cart.splice(${i},1);updateCart()" style="display:block; color:red; border:none; background:none; cursor:pointer; font-size:11px; padding:0">刪除</button></div>`).join('');
            const ori = cart.reduce((s, c) => s + c.p, 0); const sub = Math.min(ori, 100);
            document.getElementById('cart-ori').innerText = `$${ori}`; document.getElementById('cart-sub').innerText = `-$${sub}`; document.getElementById('cart-fin').innerText = `$${ori - sub}`;
        }

        async function submitOrder() {
            if (deadline && new Date() > new Date(deadline)) return alert("⏰ 點餐已截止！");
            const name = document.getElementById('student-name').value.trim();
            if (name.length < 2) return alert("請輸入真實姓名");
            if (cart.length === 0) return alert("清單不可為空");
            const ori = cart.reduce((s, c) => s + c.p, 0); const fin = ori - Math.min(ori, 100);
            const orderObj = { name, detail: cart.map(c => c.info).join('<br>'), ori, fin, paid: false, rec: 0 };
            try { await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(orderObj) }); alert("🎉 點餐成功且已同步雲端！"); } 
            catch (e) { alert("同步失敗，僅存於本機。"); }
            orders.push(orderObj); localStorage.setItem('mcd_orders_v4', JSON.stringify(orders));
            cart = []; document.getElementById('student-name').value = ""; updateCart(); renderAdmin();
        }

        function initDrinks() { document.getElementById('drink-select').innerHTML = MENU.drink.map(d => `<option>${d.n} ($${d.p})</option>`).join(''); }

        function renderAdmin() {
            const tbody = document.getElementById('admin-tbody'); const summaryDiv = document.getElementById('admin-summary');
            if (orders.length === 0) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:gray;">尚無資料</td></tr>`; return; }
            summaryDiv.innerHTML = `<div>👥 人數: <b>${orders.length}</b> (未繳: <b style="color:red">${orders.filter(o => !o.paid).length}</b>)<br>🍔 原價: <b>$${orders.reduce((s, o) => s + o.ori, 0)}</b> | 💰 應收: <b>$${orders.reduce((s, o) => s + o.fin, 0)}</b></div>`;
            tbody.innerHTML = orders.map((o, i) => `<tr class="${o.paid ? 'paid-row' : ''}"><td>${o.name}</td><td>${o.detail}</td><td>$${o.ori}</td><td style="color:red; font-weight:bold">$${o.fin}</td><td>實收 <input type="number" value="${o.rec || ''}" style="width:60px;" onchange="updatePay(${i}, this.value)"><br>找零: $${Math.max(0, (o.rec || 0) - o.fin)}</td><td><input type="checkbox" ${o.paid ? 'checked' : ''} onchange="togglePaid(${i}, this.checked)"> 已清</td><td><button onclick="deleteOrder(${i})" style="background:#dc3545; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">刪除</button></td></tr>`).join('');
        }
        
        async function syncFromCloud() { try { const response = await fetch(GAS_URL); orders = await response.json(); localStorage.setItem('mcd_orders_v4', JSON.stringify(orders)); renderAdmin(); alert("雲端同步完成！"); } catch (e) { alert("同步失敗。"); } }
        
        function switchTab(t) {
            if (t === 'admin') {
                const password = prompt("請輸入管理員密碼：");
                if (password === "0817") {
                    document.getElementById('order-view').classList.add('hidden');
                    document.getElementById('admin-view').classList.remove('hidden');
                    renderAdmin(); syncFromCloud();
                } else { alert("密碼錯誤！"); }
            } else {
                document.getElementById('order-view').classList.remove('hidden');
                document.getElementById('admin-view').classList.add('hidden');
            }
        }

        function deleteOrder(i) { if (confirm(`確定要刪除「${orders[i].name}」的訂單嗎？`)) { orders.splice(i, 1); localStorage.setItem('mcd_orders_v4', JSON.stringify(orders)); renderAdmin(); } }
        function updatePay(i, val) { orders[i].rec = parseInt(val) || 0; localStorage.setItem('mcd_orders_v4', JSON.stringify(orders)); renderAdmin(); }
        function togglePaid(i, val) { orders[i].paid = val; localStorage.setItem('mcd_orders_v4', JSON.stringify(orders)); renderAdmin(); }
        function saveDeadline() { deadline = document.getElementById('set-deadline').value; localStorage.setItem('mcd_deadline_v4', deadline); }
        function clearData() { if (confirm("確定清空所有紀錄？")) { orders = []; localStorage.removeItem('mcd_orders_v4'); renderAdmin(); } }
        function updateClock() { if (!deadline) return; const diff = new Date(deadline) - new Date(); document.getElementById('timer').innerText = diff > 0 ? `截止倒數: ${Math.floor(diff / 3600000)}時${Math.floor((diff % 3600000) / 60000)}分${Math.floor((diff % 60000) / 1000)}秒` : "點餐已截止"; }
        function copyUnpaidList() { let list = "📢 班聚收錢清單：\n"; orders.forEach(o => { if (!o.paid) list += `❓ ${o.name}：應繳 $${o.fin}\n`; }); navigator.clipboard.writeText(list); alert("已複製名單！"); }
    </script>
</body>
</html>
